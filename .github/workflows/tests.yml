name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Generar datos y correr el pipeline
        run: |
          python scripts/generate_data.py
          python -m etl.pipeline --sin-api
      - name: Tests
        run: pytest -v
